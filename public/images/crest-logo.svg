<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Crest Secondary">
  <title>Crest Secondary</title>
  <rect x="0" y="0" width="400" height="520" rx="32" ry="32" fill="#0d2f6f"/>

  <!-- Outer light-blue flame -->
  <path d="M 60 500
           C 40 380, 90 230, 200 90
           C 270 20, 360 0, 380 10
           C 360 180, 280 320, 180 430
           C 140 470, 100 500, 80 508 Z"
        fill="#4cc5ee"/>

  <!-- Yellow flame -->
  <path d="M 100 490
           C 90 380, 140 250, 235 130
           C 300 50, 355 35, 360 50
           C 340 200, 270 320, 190 410
           C 160 440, 130 470, 110 490 Z"
        fill="#ffd400"/>

  <!-- Inner light-blue flame -->
  <path d="M 145 470
           C 145 380, 190 290, 260 200
           C 305 140, 330 120, 330 130
           C 310 240, 260 320, 210 380
           C 180 420, 160 450, 150 470 Z"
        fill="#4cc5ee"/>

  <!-- Inner yellow tip -->
  <path d="M 185 450
           C 190 380, 225 320, 275 260
           C 295 240, 300 240, 295 255
           C 275 310, 240 370, 210 420
           C 200 435, 190 445, 190 450 Z"
        fill="#ffd400"/>

  <!-- Text -->
  <g font-family="'Arial Black', Arial, sans-serif" font-style="italic" fill="#ffffff" font-weight="900">
    <text x="200" y="430" font-size="66" letter-spacing="2">CREST</text>
    <text x="155" y="480" font-size="42" letter-spacing="2">SECONDARY</text>
  </g>
</svg>
